<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./style.css">
<script src="./index.js"></script>
<title>Demon Soul Simulator - Chest Calculator</title>

<style>

</style>
</head>
<body>

<div class="container">

    <h1>Demon Soul Simulator<br>Chest Calculator</h1>

    <div class="chest-row">
        <img src="images/common.png" class="chest-image" alt="Common Chest">

        <div class="chest-input">
            <label>Common Chests Opened</label>
            <input type="number" id="common" min="0" value="0">
        </div>
    </div>

    <div class="chest-row">
        <img src="images/rare.png" class="chest-image" alt="Rare Chest">

        <div class="chest-input">
            <label>Rare Chests Opened</label>
            <input type="number" id="rare" min="0" value="0">
        </div>
    </div>

    <div class="chest-row">
        <img src="images/epic.png" class="chest-image" alt="Epic Chest">

        <div class="chest-input">
            <label>Epic Chests Opened</label>
            <input type="number" id="epic" min="0" value="0">
        </div>
    </div>

    <div class="chest-row">
        <img src="images/leg.png" class="chest-image" alt="Legendary Chest">

        <div class="chest-input">
            <label>Legendary Chests Opened</label>
            <input type="number" id="legendary" min="0" value="0">
        </div>
    </div>

    <div class="chest-row">
        <img src="images/myth.png" class="chest-image" alt="Mythic Chest">

        <div class="chest-input">
            <label>Mythic Chests Opened</label>
            <input type="number" id="mythic" min="0" value="0">
        </div>
    </div>

    <button onclick="calculate()">
        Calculate Rewards
    </button>

    <div class="result" id="result">

        <h2>Results</h2>

        <p>
            🎯 Total Chest Points:
            <strong id="totalPoints">0</strong>
        </p>

        <p>
            🏆 Mythic Chests Earned:
            <strong id="mythicChests">0</strong>
        </p>

        <p>
            📦 Remaining Points:
            <strong id="remainingPoints">0</strong>
        </p>

        <p>
            ⭐ Points Needed For Next Mythic:
            <strong id="missingPoints">0</strong>
        </p>

    </div>

</div>

</body>
</html>
